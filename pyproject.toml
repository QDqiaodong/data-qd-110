[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"
[project]
name = "data-qd-110"
version = "0.1.0"
description = "Mass-conserving ceramic lot genealogy and origin contribution pipeline"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
lot-lineage = "lot_lineage.cli:main"
lot-lineage-recycle = "lot_lineage.recycle.__main__:main"
[tool.setuptools.packages.find]
where = ["src"]
